name: maki-dice
title: Maki Dice
base: core22
version: '1.9.3'
summary: Dice for role-playing games.
description: |
  Maki Dice is a fast and easy dice roller for tabletop role-playing games. Roll any of the standard polyhedral dice with a single tap, enter custom rolls using the number pad, or calculate successes for games that use a dice and difficulty system.

license: GPL-3.0
icon: assets/icon.png
passthrough:
  metadata:
    url: https://github.com/andrewmichaelpowell

confinement: strict
grade: stable

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

apps:
  makidice:
    command: bundle/makidice
    extensions: [gnome]
    desktop: xyz.andrewmichaelpowell.makidice.desktop

parts:
  flutter-app:
    plugin: dump
    source: .
    override-build: |
      if [ "$CRAFT_TARGET_ARCH" = "arm64" ]; then
        ARCH_DIR="arm64"
      else
        ARCH_DIR="x64"
      fi
      
      TARGET_BUNDLE=$(find build/linux/$ARCH_DIR/release/ -type d -name "bundle" | head -n 1)
      
      if [ -n "$TARGET_BUNDLE" ]; then
        cp -r "$TARGET_BUNDLE"/* $CRAFT_PART_INSTALL/
      else
        echo "Error: Compiled Flutter release bundle not found!"
        exit 1
      fi