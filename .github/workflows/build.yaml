# Maki Dice (Linux)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
            fpm_arch: amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            fpm_arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
        sudo gem install --no-document fpm

    - name: Configure Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Flutter (x64)
      if: matrix.architecture == 'x64'
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Configure Flutter (arm64)
      if: matrix.architecture == 'arm64'
      run: |
        git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
        echo "$HOME/flutter/bin" >> $GITHUB_PATH
        echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Build App
      run: |
        flutter config --enable-linux-desktop
        
        if [ ! -d "linux" ]; then
          flutter create --platforms=linux .
        fi

        sed -i 's|set(APPLICATION_ID "com.example.makidice")|set(APPLICATION_ID "xyz.andrewmichaelpowell.makidice")|g' linux/CMakeLists.txt
        sed -i 's|g_autofree gchar *application_id = g_strconcat("com.example.", binary_name, NULL);|g_autofree gchar *application_id = g_strdup("xyz.andrewmichaelpowell.makidice");|g' linux/runner/my_application.cc

        flutter build linux --release

    - name: Generate Packages
      run: |
        APP_ID="xyz.andrewmichaelpowell.makidice"
        FLUTTER_BUNDLE="build/linux/${{ matrix.architecture }}/release/bundle"
        STAGE_DIR="/tmp/package-staging"
        
        mkdir -p "${STAGE_DIR}/usr/lib/makidice"
        mkdir -p "${STAGE_DIR}/usr/bin"
        mkdir -p "${STAGE_DIR}/usr/share/applications"
        mkdir -p "${STAGE_DIR}/usr/share/metainfo"
        mkdir -p "${STAGE_DIR}/usr/share/icons/hicolor/256x256/apps"

        cp -r ${FLUTTER_BUNDLE}/* "${STAGE_DIR}/usr/lib/makidice/"

        ln -s /usr/lib/makidice/makidice "${STAGE_DIR}/usr/bin/makidice"

        cp assets/icon.png "${STAGE_DIR}/usr/share/icons/hicolor/256x256/apps/makidice.png"

        cat <<EOF > "${STAGE_DIR}/usr/share/applications/${APP_ID}.desktop"
        [Desktop Entry]
        Version=1.9.3
        Type=Application
        Name=Maki Dice
        Comment=Dice for role-playing games
        Exec=/usr/bin/makidice
        Icon=makidice
        Terminal=false
        Categories=Utility;Game;
        StartupWMClass=xyz.andrewmichaelpowell.makidice
        EOF

        cat <<EOF > "${STAGE_DIR}/usr/share/metainfo/${APP_ID}.metainfo.xml"
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-id">
          <id>${APP_ID}</id>
          <metadata_license>CC0-1.0</metadata_license>
          <project_license>GPL-3.0</project_license>
          <name>Maki Dice</name>
          <summary>Dice for role-playing games</summary>
          <developer_name>Andrew Powell</developer_name>
          <description>
            <p>Maki Dice is a fast and easy dice roller for tabletop role-playing games. Roll any of the standard polyhedral dice with a single tap, enter custom rolls using the number pad, or calculate successes for games that use a dice and difficulty system.</p>
          </description>
          <launchable type="desktop-id">${APP_ID}.desktop</launchable>
          <url type="homepage">https://github.com/andrewmichaelpowell</url>
          <provides>
            <binary>makidice</binary>
          </provides>
        </component>
        EOF

        fpm -s dir -t deb \
          -n makidice \
          -v 1.9.3 \
          -a "${{ matrix.fpm_arch }}" \
          --maintainer "Andrew Powell <https://github.com/andrewmichaelpowell>" \
          --vendor "Andrew Powell" \
          --license "GPL-3.0" \
          --category "games" \
          --deb-summary "Maki Dice" \
          --description "Dice for role-playing games" \
          -C "${STAGE_DIR}" .

        fpm -s dir -t rpm \
          -n makidice \
          -v 1.9.3 \
          -a "${{ matrix.fpm_arch }}" \
          --maintainer "Andrew Powell <https://github.com/andrewmichaelpowell>" \
          --vendor "Andrew Powell" \
          --license "GPL-3.0" \
          --category "Games" \
          --summary "Maki Dice" \
          --description "Dice for role-playing games" \
          -C "${STAGE_DIR}" .

        cp "${STAGE_DIR}/usr/share/applications/${APP_ID}.desktop" "${FLUTTER_BUNDLE}/"
        mkdir -p "${FLUTTER_BUNDLE}/assets"
        cp assets/icon.png "${FLUTTER_BUNDLE}/assets/icon.png"
        sed -i 's|Exec=/usr/bin/makidice|Exec=sh -c '\''cd "$(dirname "$0")" \&\& ./makidice'\''|g' "${FLUTTER_BUNDLE}/${APP_ID}.desktop"
        sed -i 's|Icon=makidice|Icon=assets/icon.png|g' "${FLUTTER_BUNDLE}/${APP_ID}.desktop"

        tar -czf "$GITHUB_WORKSPACE/makidice-linux-${{ matrix.architecture }}.tar.gz" -C build/linux/${{ matrix.architecture }}/release bundle

        for file in *.deb *.rpm; do
          if [ -f "$file" ] && [ ! -f "$GITHUB_WORKSPACE/$file" ]; then
            mv "$file" "$GITHUB_WORKSPACE/"
          fi
        done
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: |
          makidice-linux-${{ matrix.architecture }}.tar.gz
          *.deb
          *.rpm
