# Maki Dice (Linux)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        architecture: [x64, arm64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure QEMU
      if: matrix.architecture == 'arm64'
      uses: docker/setup-qemu-action@v3

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        # 1. Install speed booster and native x64 desktop tools
        sudo apt-get install -y eatmydata
        sudo eatmydata apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          # 2. Install the cross-compilers natively
          sudo eatmydata apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          # 3. Create isolated layout locations for our sandbox apt instance
          M_DIR="/tmp/arm64-sandbox"
          mkdir -p "$M_DIR/lists" "$M_DIR/status" "$M_DIR/cache" "$M_DIR/sources"
          touch "$M_DIR/status"

          # 4. Write isolated multiarch configurations using safe domain concatenation
          BASE_DOMAIN="ubuntu.com"
          PORTS_URL="http://ports.${BASE_DOMAIN}/ubuntu-ports/"

          echo "deb [arch=arm64] $PORTS_URL noble main universe restricted" > "$M_DIR/sources/arm64.list"
          echo "deb [arch=arm64] $PORTS_URL noble-updates main universe restricted" >> "$M_DIR/sources/arm64.list"
          echo "deb [arch=arm64] $PORTS_URL noble-security main universe restricted" >> "$M_DIR/sources/arm64.list"

          # 5. Build an isolated apt parameter command sequence
          APT_SANDBOX="apt-get \
            -o Dir::Etc::SourceList=$M_DIR/sources/arm64.list \
            -o Dir::Etc::SourceParts=/dev/null \
            -o Dir::State::Lists=$M_DIR/lists \
            -o Dir::State::Status=$M_DIR/status \
            -o Dir::Cache=$M_DIR/cache \
            -o APT::Architecture=arm64 \
            -o APT::Architectures=arm64"

          # 6. Fetch target metadata and download live packages automatically without 404 errors
          sudo eatmydata $APT_SANDBOX update
          
          mkdir -p /tmp/arm64-packages && cd /tmp/arm64-packages
          sudo eatmydata $APT_SANDBOX download \
            libgtk-3-0t64:arm64 libglib2.0-0t64:arm64 libpango-1.0-0:arm64 \
            libcairo2:arm64 libgdk-pixbuf-2.0-0:arm64 libatk1.0-0:arm64 \
            liblzma5:arm64 libstdc++6:arm64 libc6:arm64

          # 7. Unpack binaries inside the workspace sysroot layout
          sudo mkdir -p /opt/sysroot-arm64
          for pkg in *.deb; do
            sudo dpkg-deb -x "$pkg" /opt/sysroot-arm64
          done

          # 8. Expose environment targets for the build systems
          echo "PKG_CONFIG_DIR=" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot-arm64/usr/share/pkgconfig" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64" | sudo tee -a /etc/environment
        fi

    - name: Configure Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Build App
      run: |
        flutter config --enable-linux-desktop
        
        if [ ! -d "linux" ]; then
          flutter create --platforms=linux .
        fi

        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          export PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64
          export PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig
          flutter build linux --release --target-platform linux-arm64 --build-name=1.0.0
        else
          flutter build linux --release
        fi

    - name: Package App
      run: |
        tar -czf "$GITHUB_WORKSPACE/makidice-linux-${{ matrix.architecture }}.tar.gz" -C build/linux/${{ matrix.architecture }}/release bundle

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: makidice-linux-${{ matrix.architecture }}.tar.gz
