# Maki Dice (Linux)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
            snap_arch: amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            snap_arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Configure Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Flutter (x64)
      if: matrix.architecture == 'x64'
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Configure Flutter (arm64)
      if: matrix.architecture == 'arm64'
      run: |
        git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
        echo "$HOME/flutter/bin" >> $GITHUB_PATH
        echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Build App
      run: |
        flutter config --enable-linux-desktop
        
        if [ ! -d "linux" ]; then
          flutter create --platforms=linux .
        fi
        
        flutter build linux --release

    - name: Package App
      run: |
        BUNDLE_DIR="build/linux/${{ matrix.architecture }}/release/bundle"
        
        cat <<EOF > "${BUNDLE_DIR}/Maki Dice.desktop"
        [Desktop Entry]
        Version=1.9.3
        Type=Application
        Name=Maki Dice
        Comment=Dice for role-playing games
        Exec=bash -c 'cd "\$(dirname "\$0")" && ./makidice'
        Icon=\${ORIGIN}/data/flutter_assets/assets/icon.png
        Terminal=false
        Categories=Utility;
        X-GNOME-Autostart-enabled=true
        EOF

        chmod +x "${BUNDLE_DIR}/Maki Dice.desktop"
        chmod +x "${BUNDLE_DIR}/makidice"
        tar -czf "$GITHUB_WORKSPACE/makidice-linux-${{ matrix.architecture }}.tar.gz" -C build/linux/${{ matrix.architecture }}/release bundle


    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: |
          makidice-linux-${{ matrix.architecture }}.tar.gz
