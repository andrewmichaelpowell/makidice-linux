# Maki Dice (Linux)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        architecture: [x64, arm64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure QEMU
      if: matrix.architecture == 'arm64'
      uses: docker/setup-qemu-action@v3

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y eatmydata
        sudo eatmydata apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          sudo eatmydata apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          mkdir -p /tmp/arm64-packages
          cd /tmp/arm64-packages
          sudo mkdir -p /opt/sysroot-arm64

          BASE_URL="http://ports.ubuntu.com/ubuntu-ports/pool/main"
          
          wget -q "${BASE_URL}/g/glib2.0/libglib2.0-0t64_2.80.0-6ubuntu3.2_arm64.deb"
          wget -q "${BASE_URL}/g/gtk+3.0/libgtk-3-0t64_3.24.41-4ubuntu1.3_arm64.deb"
          wget -q "${BASE_URL}/p/pango1.0/libpango-1.0-0_1.52.1+ds-1build1_arm64.deb"
          wget -q "${BASE_URL}/c/cairo/libcairo2_1.18.0-3gb1_arm64.deb"
          wget -q "${BASE_URL}/g/gdk-pixbuf/libgdk-pixbuf-2.0-0_2.42.10+dfsg-3ubuntu3.1_arm64.deb"
          wget -q "${BASE_URL}/a/atk1.0/libatk1.0-0_2.38.0-2build2_arm64.deb"
          wget -q "${BASE_URL}/x/xz-utils/liblzma5_5.6.1-1_arm64.deb"
          wget -q "${BASE_URL}/g/gcc-13/libstdc++6_13.3.0-6ubuntu2~24.04_arm64.deb"
          wget -q "${BASE_URL}/g/glibc/libc6_2.39-0ubuntu8.3_arm64.deb"

          for pkg in *.deb; do
            sudo dpkg-deb -x "$pkg" /opt/sysroot-arm64
          done

          echo "PKG_CONFIG_DIR=" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot-arm64/usr/share/pkgconfig" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64" | sudo tee -a /etc/environment
        fi

    - name: Configure Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Build App
      run: |
        flutter config --enable-linux-desktop
        
        if [ ! -d "linux" ]; then
          flutter create --platforms=linux .
        fi

        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          export PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64
          export PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig
          flutter build linux --release --target-platform linux-arm64 --build-name=1.0.0
        else
          flutter build linux --release
        fi

    - name: Package App
      run: |
        tar -czf "$GITHUB_WORKSPACE/makidice-linux-${{ matrix.architecture }}.tar.gz" -C build/linux/${{ matrix.architecture }}/release bundle

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: makidice-linux-${{ matrix.architecture }}.tar.gz
