name: Build Maki Dice

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, arm64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up QEMU
      if: matrix.architecture == 'arm64'
      uses: docker/setup-qemu-action@v3

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        # 1. Install standard native x64 build tools and development libraries
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          # 2. Register the architecture 
          sudo dpkg --add-architecture arm64

          # 3. Setup split sources using the domain wrapper to bypass formatting issues
          BASE_DOMAIN="ubuntu.com"
          MAIN_MIRROR="http://archive.${BASE_DOMAIN}/ubuntu/"
          SEC_MIRROR="http://security.${BASE_DOMAIN}/ubuntu/"
          PORTS_MIRROR="http://ports.${BASE_DOMAIN}/ubuntu-ports/"

          echo "Types: deb" | sudo tee /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "URIs: $MAIN_MIRROR $SEC_MIRROR" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Suites: noble noble-updates noble-security noble-backports" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Components: main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Architectures: amd64" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Types: deb" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "URIs: $PORTS_MIRROR" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Suites: noble noble-updates noble-security noble-backports" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Components: main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null
          echo "Architectures: arm64" | sudo tee -a /etc/apt/sources.list.d/multiarch-split.sources > /dev/null

          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

          # 4. Install the cross-compilers on the host (these do not collide)
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          # 5. Download the ARM64 binaries and unpack them safely inside an isolated sysroot folder
          mkdir -p /tmp/arm64-packages
          cd /tmp/arm64-packages
          apt-get download \
            libgtk-3-0:arm64 libglib2.0-0:arm64 libpango-1.0-0:arm64 \
            libcairo2:arm64 libgdk-pixbuf-2.0-0:arm64 libatk1.0-0:arm64 \
            liblzma5:arm64 libstdc++6:arm64 libc6:arm64

          sudo mkdir -p /opt/sysroot-arm64
          for pkg in *.deb; do
            sudo dpkg-deb -x "$pkg" /opt/sysroot-arm64
          done

          # 6. Inform pkg-config and your compilers where the isolated ARM64 assets live
          echo "PKG_CONFIG_DIR=" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot-arm64/usr/share/pkgconfig" | sudo tee -a /etc/environment
          echo "PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64" | sudo tee -a /etc/environment
        fi

    - name: Configure Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Build Linux app
      run: |
        flutter config --enable-linux-desktop
        if [ "${{ matrix.architecture }}" = "arm64" ]; then
          # Explicitly target arm64 architecture and feed toolchain paths to CMake
          export PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-arm64
          export PKG_CONFIG_PATH=/opt/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig
          flutter build linux --release --target-platform linux-arm64 --build-name=1.0.0
        else
          flutter build linux --release
        fi

    - name: Package App
      run: |
        cd build/linux/${{ matrix.architecture }}/release/
        tar -czf ../../../makidice-linux-${{ matrix.architecture }}.tar.gz bundle

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: makidice-linux-${{ matrix.architecture }}.tar.gz
