# Maki Dice (Linux)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
            snap_arch: amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm64-4core
            snap_arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Build App
      run: |
        flutter config --enable-linux-desktop
        
        if [ ! -d "linux" ]; then
          flutter create --platforms=linux .
        fi
        
        flutter build linux --release

    - name: Package App
      run: |
        tar -czf "$GITHUB_WORKSPACE/makidice-linux-${{ matrix.architecture }}.tar.gz" -C build/linux/${{ matrix.architecture }}/release bundle

    - name: Build Snap Package
      uses: canonical/action-snapcraft@v3
      with:
        architecture: ${{ matrix.snap_arch }}

    # - name: Upload Snap Package
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   uses: canonical/action-publish@v1
    #   env:
    #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    #   with:
    #     snap: ${{ steps.build.outputs.snap || './*.snap' }}
    #     channel: edge

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: makidice-linux-${{ matrix.architecture }}
        path: |
          makidice-linux-${{ matrix.architecture }}.tar.gz
          ./*.snap
